[pytest]
pythonpath = .
# Указываем pytest автоматически искать асинхронные тесты
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

# Путь к тестовым файлам
testpaths = tests

# Отключаем предупреждения (warnings), чтобы они не засоряли консоль
filterwarnings =
    ignore::DeprecationWarning
